<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d3a300" />
  <meta name="description" content="AKWASIGN Pub &amp; Design : création graphique et réalisation publicitaire." />
  <title>AKWASIGN | Pub &amp; Design</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="responsive.css" />
</head>

<body id="akwasign">
  <main class="page-wrapper">

    <header class="logo">
      <video autoplay muted loop playsinline preload="auto" poster="hero-poster.jpg" aria-label="Animation du logo AKWASIGN">
        <source src="Hero.mp4" type="video/mp4" />
      </video>
    </header>

    <section class="content">
      <picture><source srcset="logo2.webp" type="image/webp" /><img src="logo2.png" width="1920" height="651" alt="AKWASIGN Pub &amp; Design" class="logo-mark" /></picture>

      <picture><source srcset="p1.webp" type="image/webp" /><img src="p1.png" width="1920" height="1350" alt="Nous sommes des passionnés de la création graphique et réalisation publicitaire. Chez AKWASIGN nous donnons vie à vos idées à travers le design. Ensemble, rendons votre communication visuelle unique et impactante." loading="lazy" decoding="async" /></picture>

      <picture><source srcset="p2.webp" type="image/webp" /><img src="p2.png" width="1921" height="651" alt="Pour toute commande, question ou proposition de collaboration, veuillez nous contacter :" loading="lazy" decoding="async" /></picture>

      <div class="actions">
        <a class="btn" href="tel:+213550808444">
          <picture><source srcset="call1.webp" type="image/webp" /><img src="call1.png" width="1920" height="651" alt="Appeler" loading="lazy" decoding="async" /></picture>
        </a>
        <a class="btn" href="https://wa.me/213550808444" target="_blank" rel="noopener">
          <picture><source srcset="wattsap.webp" type="image/webp" /><img src="wattsap.png" width="1920" height="651" alt="Contacter sur WhatsApp" loading="lazy" decoding="async" /></picture>
        </a>
      </div>

      <picture><source srcset="followus.webp" type="image/webp" /><img src="followus.png" width="1920" height="651" alt="Follow us" loading="lazy" decoding="async" /></picture>

      <div class="scroll-container">
        <a href="https://www.tiktok.com/@akwasign" target="_blank" rel="noopener"><picture><source srcset="tik.webp" type="image/webp" /><img src="tik.png" width="501" height="500" alt="TikTok" loading="lazy" decoding="async" /></picture></a>
        <a href="https://www.instagram.com/akwasign" target="_blank" rel="noopener"><picture><source srcset="insta.webp" type="image/webp" /><img src="insta.png" width="501" height="501" alt="Instagram" loading="lazy" decoding="async" /></picture></a>
        <a href="https://www.facebook.com/profile.php?id=100063665006366" target="_blank" rel="noopener"><picture><source srcset="fb.webp" type="image/webp" /><img src="fb.png" width="501" height="501" alt="Facebook" loading="lazy" decoding="async" /></picture></a>
        <a href="https://www.linkedin.com/in/akwa-sign-1b641b390/" target="_blank" rel="noopener"><picture><source srcset="in.webp" type="image/webp" /><img src="in.png" width="501" height="501" alt="LinkedIn" loading="lazy" decoding="async" /></picture></a>
      </div>

      <a class="btn map-link" href="https://maps.app.goo.gl/Dwbf5M62AYicVU9m6" target="_blank" rel="noopener">
        <picture><source srcset="MAP.webp" type="image/webp" /><img src="MAP.png" width="1920" height="651" alt="Ouvrir dans Google Maps" loading="lazy" decoding="async" /></picture>
      </a>

      <video class="loc-video" autoplay muted loop playsinline preload="metadata" poster="loc-poster.jpg" aria-label="Itinéraire à pied jusqu'à AKWASIGN">
        <source src="LOC.mp4" type="video/mp4" />
      </video>
    </section>

    <footer class="site-footer">
      <form class="contact-form" id="contact-form" action="https://formsubmit.co/contact.akwasign@gmail.com" method="POST" novalidate>
        <h2>Écrivez-nous</h2>
        <label for="cf-name">Nom</label>
        <input id="cf-name" name="name" type="text" autocomplete="name" required maxlength="100" />
        <label for="cf-email">Votre e-mail</label>
        <input id="cf-email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="150" />
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" rows="6" required maxlength="3000"></textarea>
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true" />
        <input type="hidden" name="_subject" value="Nouveau message depuis le site AKWASIGN" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_captcha" value="false" />
        <button type="submit" class="send">Envoyer</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
      <p class="copyr">© All rights reserved.</p>
    </footer>

  </main>

  <script>
    // Respect "reduce motion": show the poster frame instead of autoplaying.
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelectorAll("video").forEach(function (v) { v.removeAttribute("autoplay"); v.pause(); v.controls = true; });
    }
  </script>
  <script>
    (function () {
      var f = document.getElementById("contact-form"); if (!f) return;
      var st = f.querySelector(".form-status"), btn = f.querySelector(".send");
      function show(cls, msg) { st.className = "form-status " + cls; st.textContent = msg; }
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!f.checkValidity()) { f.reportValidity(); return; }
        btn.disabled = true; show("", "Envoi en cours…");
        fetch("https://formsubmit.co/ajax/contact.akwasign@gmail.com", {
          method: "POST", headers: { "Accept": "application/json" }, body: new FormData(f)
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (String(d.success) === "true") {
            f.reset(); show("ok", "Merci ! Votre message a bien été envoyé.");
          } else if (/activat/i.test(d.message || "")) {
            show("err", "Presque prêt : un e-mail d'activation a été envoyé à contact.akwasign@gmail.com. Confirmez-le (vérifiez aussi les spams), puis renvoyez le message.");
          } else {
            show("err", "L'envoi a échoué : " + (d.message || "erreur inconnue"));
          }
        }).catch(function () {
          // Network/CORS problem (e.g. page opened from a local file): fall back to a normal form post.
          show("", "Envoi en cours…"); f.submit();
        }).finally(function () { btn.disabled = false; });
      });
    })();
  </script>
</body>
</html>
